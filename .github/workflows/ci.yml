name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read   # the secret scan reads the PR's commits

jobs:
  rules:
    name: Rules engine gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: for f in web/js/*.js web/api/*.js scripts/*.mjs; do node --check "$f"; done
      - name: Data readiness and scoring calibration (go/no-go gates G-B, G-C)
        run: node scripts/check_engine.mjs
      - name: Phrasing bias
        run: node scripts/check_bias.mjs
      - name: API pack in sync with the web pack
        run: |
          cp data/pack.json /tmp/pack.before.json
          node scripts/export_pack.mjs
          diff -q data/pack.json /tmp/pack.before.json

  api:
    name: API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: cd api && uv sync --frozen
      - name: Imports and health
        run: |
          cd api && uv run python -c "
          from fastapi.testclient import TestClient
          import callready.main as m
          c = TestClient(m.app)
          assert c.get('/health').json()['ok']
          assert c.post('/api/coach', json={'qid': 'Q01', 'answer': 'x' * 20}).status_code in (200, 503)
          print('ok')"

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
