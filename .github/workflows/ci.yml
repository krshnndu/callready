name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read   # the secret scan reads the PR's commits

jobs:
  rules:
    name: Rules engine gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Syntax
        run: for f in web/js/*.js web/api/*.js scripts/*.mjs; do node --check "$f"; done
      - name: Data readiness and scoring calibration (go/no-go gates G-B, G-C)
        run: node scripts/check_engine.mjs
      - name: Phrasing bias
        run: node scripts/check_bias.mjs
      - name: Guardrails (sanitiser, financial sanity rules, upload limits)
        run: node scripts/check_guardrails.mjs
      - name: "Fuzz (10,000 mutated packs: missing, zero and negative values)"
        run: node scripts/check_fuzz.mjs 10000
      - name: Rule-based extractor (sample document)
        run: node scripts/check_extract_rules.mjs /nonexistent
      - name: API pack in sync with the web pack
        run: |
          cp data/pack.json /tmp/pack.before.json
          node scripts/export_pack.mjs
          diff -q data/pack.json /tmp/pack.before.json

  api:
    name: API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: cd api && uv sync --frozen
      - name: Guardrail tests (auth, caps, limits, output caps, retention, injection rules)
        run: cd api && uv run pytest -q tests

  browser:
    name: Browser gates (XSS, content, layout, chart truth)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Serve the web app (no-store, so the gates test the code on disk)
        run: (node scripts/serve.mjs &) && sleep 2
      - name: XSS gate (hostile pack on every screen)
        run: CHROME=$(which google-chrome) node scripts/check_xss.mjs
      - name: Content gate (options, labels, quotes, punctuation on every screen)
        run: CHROME=$(which google-chrome) node scripts/check_content.mjs
      - name: Layout gate (6 screens x 7 companies x 2 sizes)
        run: CHROME=$(which google-chrome) node scripts/check_layout.mjs
      - name: "Chart-truth gate (every mark at its value, on every screen and on random data)"
        run: CHROME=$(which google-chrome) node scripts/check_charts.mjs

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
